<style>
:root {
  color-scheme: dark;
  --ink: #f4f2ff;
  --muted: #b7b4ca;
  --base: #100e19;
  --panel: #1a1726;
  --line: #38334c;
  --lime: #d8ff65;

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--base); color: var(--ink); font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
[hidden] { display: none !important; }
.wrap { width: min(1320px, calc(100% - 64px)); margin-inline: auto; }
.site-header { background: #11101a; border-bottom: 1px solid var(--line); }
.header-row { min-height: 79px; display: flex; align-items: center; gap: 33px; }
.wordmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 900; font-size: 25px; font-style: italic; letter-spacing: -.065em; white-space: nowrap; }
.logo { display: inline-grid; place-items: center; width: 33px; height: 33px; background: var(--lime); color: #191523; clip-path: polygon(17% 0,100% 0,100% 78%,82% 100%,0 100%,0 22%); font-style: normal; font-size: 21px; }
.header-row nav { margin-right: auto; display: flex; gap: 23px; align-items: center; font-size: 14px; font-weight: 650; color: var(--muted); }
.header-row nav a:hover { color: var(--lime); }
.header-actions, .actions, .tags, .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.header-actions { margin-left: auto; flex-wrap: nowrap; }
.btn, .tag { border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: #242032; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 13px; min-height: 41px; font-size: 14px; font-weight: 700; }
.btn:not(:disabled):hover, .tag:hover { border-color: var(--purple); color: var(--purple); }
.btn.primary { border-color: var(--lime); background: var(--lime); color: #181820; }
.btn.primary:not(:disabled):hover { background: #ebffa7; border-color: #ebffa7; color: #181820; }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 4px; background: #433660; color: #f0eaff; padding: 0 5px; font-size: 11px; }
.hero { position: relative; isolation: isolate; overflow: hidden; margin-top: 25px; min-height: 475px; display: grid; grid-template-columns: minmax(0,1.08fr) minmax(0,1fr); align-items: stretch; background: #1c1432; border: 1px solid #51416c; border-radius: 12px; }
.hero::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(ellipse at 73% 38%,var(--glow,#5943a0),transparent 64%), linear-gradient(110deg,#1a142b,#29203f); }
.hero-copy { min-width: 0; align-self: center; padding: 46px 8px 86px 53px; z-index: 2; }
.hero-kicker, .eyebrow { margin: 0 0 14px; color: var(--lime); font-size: 12px; font-weight: 800; letter-spacing: .14em; }
.hero h1 { font-family: "Arial Black","Segoe UI",sans-serif; font-size: clamp(29px,5.05vw,75px); line-height: .98; letter-spacing: -.068em; margin: 0 0 20px; }
.hero h1 span { display: block; }
.hero h1 span + span { color: #d0c2ff; }
.hero-copy > p:not(.hero-kicker) { color: #ded9f1; line-height: 1.65; margin: 0 0 24px; font-size: 15px; word-break: keep-all; }
.hero-visual { position: relative; overflow: hidden; min-height: 350px; display: flex; align-items: center; justify-content: center; }
.hero-visual::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg,transparent 0 43px,#f8eeff22 44px 45px), repeating-linear-gradient(0deg,transparent 0 43px,#f8eeff22 44px 45px); mask-image: radial-gradient(ellipse,#000 12%,transparent 73%); }
.hero-visual::after { content: ""; position: absolute; width: 65%; aspect-ratio: 1; border: 1px solid #e4d6ff36; border-radius: 50%; box-shadow: 0 0 0 22px #eadcff10, inset 0 0 35px #f0d7ff17; }
.hero-visual img { position: relative; z-index: 1; width: 100%; height: 390px; padding: 24px 65px 62px 17px; object-fit: contain; filter: drop-shadow(0 22px 17px #0d081cb0); }
.hero-controls { position: absolute; bottom: 20px; left: 53px; right: 22px; display: flex; align-items: center; gap: 10px; z-index: 3; }
#dots { display: flex; gap: 7px; }
.hero-dot { width: 28px; height: 30px; border: 0; background: transparent; padding: 0; }
.hero-dot::before { content: ""; display: block; border-radius: 3px; height: 3px; background: #b8aed0; }
.hero-dot[aria-current="true"]::before { background: var(--lime); }
.hero-arrows { margin-left: auto; display: flex; gap: 7px; }
.hero-arrows button { min-width: 38px; height: 37px; color: white; border: 1px solid #b5a4d375; background: #1d152c; border-radius: 6px; font-size: 20px; }
.hero-arrows button:hover { color: var(--lime); border-color: var(--lime); }
.category-strip { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-top: 14px; }
.department { position: relative; isolation: isolate; height: 102px; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; padding: 14px; border: 1px solid #473d60; border-radius: 8px; color: var(--ink); background: linear-gradient(115deg,#221b35,#312747); text-align: left; }
.department:hover, .department[aria-pressed="true"] { border-color: var(--lime); }
.department span { position: relative; z-index: 1; font-size: 16px; font-weight: 800; }
.department .department-count { color: #c4b9d9; font-size: 12px; font-weight: 500; }
.department img { position: absolute; z-index: -1; right: 5px; top: 10px; width: 52%; height: 80px; object-fit: contain; filter: drop-shadow(0 7px 7px #0009); }
.catalog { padding: 49px 0 65px; scroll-margin-top: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 19px; }
.section-head h2 { margin: 0; font-size: 34px; letter-spacing: -.055em; line-height: 1.2; }
.eyebrow { margin-bottom: 7px; }
.search, .filters select { min-height: 41px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; background: #1e1a2c; color: var(--ink); }
.search { width: min(100%,300px); }
.search::placeholder { color: #b1abc5; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-block: 1px solid var(--line); padding-block: 13px; }
.tag[aria-pressed="true"] { background: #d8ff6520; color: var(--lime); border-color: var(--lime); }
.result-row { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; min-height: 41px; }
.result-row p { margin: 0; color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
.card { min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; transition: border-color .18s; }
.card:hover { border-color: #7d6ba3; }
.product-photo { position: relative; flex: none; overflow: hidden; height: 198px; background: radial-gradient(ellipse at 52% 43%,#e4dcf3,#9d8bb7 95%); }
.product-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 25px 23px 18px; }
.badge { position: absolute; z-index: 1; top: 10px; left: 10px; padding: 5px 7px; background: #242033; color: #f3eeff; border-radius: 4px; font-size: 11px; font-weight: 700; }
.card-body { padding: 15px; display: flex; flex: 1; flex-direction: column; }
.brand { color: var(--purple); font-size: 11px; margin: 0 0 6px; font-weight: 850; letter-spacing: .09em; }
.card h3 { font-size: 18px; margin: 0 0 7px; letter-spacing: -.026em; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 14px; }
.price { font-size: 19px; font-weight: 800; margin: auto 0 13px; }
.card .actions { gap: 6px; align-items: stretch; }
.card .actions .btn { min-height: 36px; padding: 6px 8px; font-size: 13px; }
.card .primary { flex: 1; white-space: nowrap; }
.selected { background: #433465; color: #e8dcff; border-color: var(--purple); }
.empty { grid-column: 1 / -1; text-align: center; padding: 48px 12px; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
.footer { border-top: 1px solid var(--line); padding: 22px 0 31px; color: var(--muted); font-size: 13px; }
.footer-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
.footer strong { color: var(--ink); }
.footer a, .source-link { text-decoration: underline; text-underline-offset: 3px; color: var(--purple); }
dialog { width: min(580px,calc(100% - 24px)); max-height: calc(100% - 30px); border: 1px solid #61547b; border-radius: 10px; padding: 0; background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px #000a; }
dialog::backdrop { background: #080710bd; }
.wide { width: min(840px,calc(100% - 24px)); }
.dialog-head { position: sticky; z-index: 2; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 19px; }
.dialog-head h2 { margin: 0; font-size: 19px; }
.dialog-head button { font-size: 22px; line-height: 1; min-height: 34px; padding: 5px 10px; }
.content { padding: 18px 19px 22px; }
.content h3 { margin-top: 0; }
.content p { line-height: 1.55; }
.dialog-product { width: 100%; height: 200px; object-fit: contain; background: #c5b8de; border-radius: 8px; padding: 12px 16px; }
.table-scroll { overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 10px 8px; min-width: 76px; }
thead th { background: #2e2641; }
td img { width: 115px; height: 70px; object-fit: contain; background: #b3a2cb; border-radius: 5px; padding: 4px; }
.cart-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }

.cart-controls { display: flex; align-items: center; gap: 5px; }

.total { display: flex; justify-content: space-between; gap: 12px; font-weight: 800; }
.content form { display: grid; gap: 10px; margin-block: 12px; }
.content form .search { width: 100%; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: calc(100vw - 24px); width: max-content; background: var(--lime); color: #1c1928; padding: 11px 15px; border-radius: 6px; font-size: 14px; font-weight: 700; }
.muted { color: var(--muted); }

@media (max-width: 1100px) {

}
@media (max-width: 670px) {

  .department { height: 73px; padding: 9px; }
  .department img { top: 7px; height: 58px; }
  .catalog { padding-top: 33px; }
  .section-head { align-items: stretch; flex-direction: column; gap: 12px; }
  .section-head h2 { font-size: 28px; }
  .search { width: 100%; }
  .grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }

  .card .actions .btn { min-height: 32px; padding: 5px 6px; font-size: 12px; }
  .card .primary { flex-basis: 100%; }
  .cart-item { grid-template-columns: 1fr; }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>

  {id:"blackshark", brand:"Razer", name:"BlackShark V2 HyperSpeed", category:"headset", price:159000, connection:"2.4 GHz 무선 / Bluetooth / USB", feature:"50 mm 드라이버 · 광대역 붐 마이크", color:"블랙", source:"https://www.razer.com/gaming-headsets/razer-blackshark-v2-hyperspeed/RZ04-04960100-R3U1"},
  {id:"g733", brand:"Logitech G", name:"G733 LIGHTSPEED", category:"headset", price:159000, connection:"2.4 GHz 무선", feature:"LIGHTSYNC RGB · 서스펜션 헤드밴드", color:"라일락", source:"https://www.logitechg.com/en-us/shop/p/g733-rgb-wireless-headset"},
  {id:"prox2", brand:"Logitech G", name:"PRO X 2 LIGHTSPEED", category:"headset", price:299000, connection:"2.4 GHz 무선 / Bluetooth / 3.5 mm", feature:"50 mm 그래핀 드라이버", color:"화이트", source:"https://www.logitechg.com/en-us/shop/p/pro-x-2-wireless-headset"},
  {id:"chroma", brand:"Razer", name:"Hammerhead V3 Chroma", category:"earbuds", price:139000, connection:"USB-C 유선", feature:"액티브 노이즈 캔슬링 · Chroma RGB", color:"블랙", source:"https://www.razer.com/kr-kr/mobile-earphones/razer-hammerhead-v3-chroma"},
  {id:"hyper3", brand:"Razer", name:"Hammerhead V3 HyperSpeed", category:"earbuds", price:239000, connection:"2.4 GHz 무선 / Bluetooth", feature:"하이브리드 ANC · IPX4", color:"블랙", source:"https://www.razer.com/kr-kr/mobile-earphones/razer-hammerhead-v3-hyperspeed"},
  {id:"hyper3x", brand:"Razer", name:"Hammerhead V3 X HyperSpeed", category:"earbuds", price:119000, connection:"2.4 GHz 무선 / Bluetooth", feature:"USB-C 무선 동글 · 맞춤형 터치 조작", color:"블랙", source:"https://www.razer.com/kr-kr/mobile-earphones/razer-hammerhead-v3-x-hyperspeed"}
];
const slides = [
  {id:"superlight", title:["PRO X","SUPERLIGHT 2"], text:"60 g의 가벼운 무게와 HERO 2 센서를 갖춘 무선 마우스.", glow:"#694aa8"},
  {id:"g515", title:["G515","LIGHTSPEED TKL"], text:"낮은 높이의 GL 스위치와 공간을 아끼는 텐키리스 배열.", glow:"#625fb3"},
  {id:"hs80", title:["HS80 MAX","WIRELESS"], text:"50 mm 드라이버와 두 가지 무선 연결 방식을 갖춘 게이밍 헤드셋.", glow:"#824c9b"}
];

const $ = selector => document.querySelector(selector);
const money = amount => new Intl.NumberFormat("ko-KR").format(amount) + "원";
const photo = product => "./img/" + product.id + ".webp";
const findProduct = id => products.find(product => product.id === id);
const storageKey = "gearlab-week12-v1";
let saved;
try { saved = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch { saved = {}; }
const state = {
  category:"all",
  compare:new Set(),
  cart:Object.fromEntries(Object.entries(saved.cart || {}).filter(([id, count]) =>
    findProduct(id) && Number.isInteger(count) && count >= 1 && count <= 99)),
  member:saved.member || null
};
let slideIndex = 0;
let slideTimer;
let toastTimer;
let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;

function persist() {
  try { localStorage.setItem(storageKey, JSON.stringify({cart:state.cart, member:state.member})); }
  catch { /* The current page still works when browser storage is unavailable. */ }
}

function announce(message) {
  const toast = $("#toast");
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 2500);
}

function renderSlide() {
  const slide = slides[slideIndex];
  const product = findProduct(slide.id);
  $("#hero").style.setProperty("--glow", slide.glow);
  $("#heroBrand").textContent = product.brand.toUpperCase() + " / " + categories[product.category];
  $("#heroTitle").replaceChildren(...slide.title.map(line => {
    const span = document.createElement("span");
    span.textContent = line;
    return span;
  }));
  $("#heroText").textContent = slide.text;
  $("#heroImage").src = photo(product);
  $("#heroImage").alt = product.name + " 제품 사진";
  $("#dots").querySelectorAll("button").forEach((dot,index) => dot.setAttribute("aria-current", String(index === slideIndex)));
}

function resetTimer() {
  clearInterval(slideTimer);
  if (playing) slideTimer = setInterval(() => {
    if (!document.hidden && !$("#dialog").open && !$("#hero").contains(document.activeElement)) {
      slideIndex = (slideIndex + 1) % slides.length;
      renderSlide();
    }
  }, 6500);
}

function goToSlide(index) {
  slideIndex = (index + slides.length) % slides.length;
  renderSlide();
  resetTimer();
}

function renderPause() {
  const button = $("#pause");
  button.textContent = playing ? "Ⅱ" : "▶︎";
  button.setAttribute("aria-label", playing ? "자동 재생 일시정지" : "자동 재생 시작");
}

function renderCatalog() {
  const query = $("#search").value.trim().toLowerCase();
  const brand = $("#brandFilter").value;
  const sort = $("#sort").value;
  const matches = products.filter(product =>
    (state.category === "all" || state.category === product.category) &&
    (!brand || brand === product.brand) &&
    [product.name, product.brand, categories[product.category], {Razer:"레이저", "Logitech G":"로지텍", CORSAIR:"커세어"}[product.brand]]
      .join(" ").toLowerCase().includes(query));
  if (sort) matches.sort((a, b) => sort === "asc" ? a.price - b.price : b.price - a.price);
  document.querySelectorAll("[data-category]").forEach(button =>
    button.setAttribute("aria-pressed", String(button.dataset.category === state.category)));
  $("#resultCount").textContent = "상품 " + matches.length + "개";
  $("#compareCount").textContent = state.compare.size;
  $("#products").innerHTML = matches.map(product => {
    const checked = state.compare.has(product.id);
    return `<article class="card">
      <div class="product-photo"><span class="badge">${categories[product.category]}</span><img src="${photo(product)}" alt="${product.name} 제품 사진" decoding="async"></div>
      <div class="card-body"><p class="brand">${product.brand}</p><h3>${product.name}</h3><p class="meta">${product.feature}</p><p class="price">${money(product.price)}</p>
      <div class="actions">
        <button class="btn" data-action="details" data-id="${product.id}">상세</button>
        <button class="btn${checked ? " selected" : ""}" data-action="compare" data-id="${product.id}" aria-pressed="${checked}">비교 담기</button>
        <button class="btn primary" data-action="add" data-id="${product.id}">장바구니</button>
      </div></div>
    </article>`;
  }).join("") || '<p class="empty">조건에 맞는 상품이 없어요. 검색어와 필터를 확인해 주세요.</p>';
}

function showDialog(title, content, wide = false) {
  const dialog = $("#dialog");
  dialog.classList.toggle("wide", wide);
  $("#dialogTitle").textContent = title;
  $("#dialogBody").innerHTML = content;
  if (!dialog.open) dialog.showModal();
}

function showDetails(product) {
  showDialog(product.name, `<img class="dialog-product" src="${photo(product)}" alt="${product.name} 제품 사진">
    <p><strong>${product.brand}</strong> · ${categories[product.category]} · ${product.color}</p>
    <p>${product.feature}<br>연결 방식 · ${product.connection}</p>
    <p class="total"><span>시연 가격</span><span>${money(product.price)}</span></p>
    <div class="actions"><button class="btn primary" data-action="add" data-id="${product.id}">장바구니</button>
    <a class="btn source-link" href="${product.source}" target="_blank" rel="noopener">브랜드 공식 제품 페이지 ↗</a></div>
    <p id="detailStatus" class="muted" role="status" hidden></p>`);
}

function showComparison() {
  if (state.compare.size < 2) {
    announce("비교할 제품을 2개 이상 담아 주세요.");
    return;
  }
  const chosen = [...state.compare].map(findProduct);
  const rows = [
    ["제품 사진", p => `<img src="${photo(p)}" alt="${p.name}">`],
    ["브랜드", p => p.brand],
    ["분류", p => categories[p.category]],
    ["가격", p => money(p.price)],
    ["연결 방식", p => p.connection],
    ["주요 사양", p => p.feature],
    ["색상", p => p.color]
  ];
  showDialog("제품 사양 비교", `<div class="table-scroll" tabindex="0" aria-label="제품 비교 표"><table>
    <thead><tr><th scope="col">항목</th>${chosen.map(p => `<th scope="col">${p.name}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(([label, value]) => `<tr><th scope="row">${label}</th>${chosen.map(p => `<td>${value(p)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div><p><button class="btn" data-action="clear-compare">비교 목록 비우기</button></p>`, true);
}

function cartTotal() {
  return Object.entries(state.cart).reduce((sum, [id, quantity]) => sum + findProduct(id).price * quantity, 0);
}

function updateCartCount() {
  $("#cartCount").textContent = Object.values(state.cart).reduce((sum, quantity) => sum + quantity, 0);
}

function changeCart(id, quantity) {
  if (quantity > 0) state.cart[id] = Math.min(quantity, 99);
  else delete state.cart[id];
  persist();
  updateCartCount();
}

function tier(spent) {
  if (spent >= 500000) return {name:"골드", rate:0.05};
  if (spent >= 200000) return {name:"실버", rate:0.03};
  return {name:"베이직", rate:0.01};
}

function showCart() {
  const items = Object.entries(state.cart);
  const current = state.member && tier(state.member.spent);
  showDialog("장바구니", items.length ? `
    ${items.map(([id, quantity]) => {
      const product = findProduct(id);
      return `<div class="cart-item"><div><strong>${product.name}</strong><p>${money(product.price)} · 소계 ${money(product.price * quantity)}</p></div>
        <div class="cart-controls">
          <button class="btn" data-action="less" data-id="${id}" aria-label="${product.name} 수량 줄이기" ${quantity === 1 ? "disabled" : ""}>−</button><span aria-label="수량">${quantity}</span>
          <button class="btn" data-action="more" data-id="${id}" aria-label="${product.name} 수량 늘리기" ${quantity === 99 ? "disabled" : ""}>+</button>
          <button class="btn" data-action="remove" data-id="${id}" aria-label="${product.name} 삭제">삭제</button>
        </div></div>`;
    }).join("")}
    <p class="total"><span>결제 합계</span><span>${money(cartTotal())}</span></p>
    <p class="muted">${current ? `적립 예정 ${Math.floor(cartTotal() * current.rate).toLocaleString("ko-KR")} P · ${current.name} 등급` : "데모 회원을 등록하면 결제 후 포인트가 적립됩니다."}</p>
    <button class="btn primary" data-action="checkout">모의 결제하기</button>` : '<p class="muted">장바구니가 비어 있어요.</p>');
}

function showMember() {
  const member = state.member;
  const current = member && tier(member.spent);
  showDialog("데모 멤버십", member ? `<h3 id="memberName"></h3>
    <p><strong>${current.name}</strong> 등급 · 보유 포인트 ${member.points.toLocaleString("ko-KR")} P</p>
    <p class="muted">누적 모의 결제액 ${money(member.spent)}</p>
    <p class="muted">베이직 1% · 20만원부터 실버 3% · 50만원부터 골드 5%</p>
    <p class="muted">결제 시점의 등급으로 적립하고 결제 후 누적액에 따라 등급을 갱신합니다.</p>`
    : `<p>닉네임으로 회원 등록을 체험하고 모의 결제에서 포인트를 받아 보세요.</p>
      <form id="memberForm"><label for="nickname">닉네임</label>
      <input class="search" id="nickname" name="nickname" required maxlength="24" placeholder="예: 기어랩유저">
      <button class="btn primary" type="submit">데모 회원 등록</button></form>
      <p class="muted">등록 정보는 현재 브라우저에 저장됩니다.</p>`);
  if (member) $("#memberName").textContent = member.nickname + "님";
}

function checkout() {
  const total = cartTotal();
  if (!total) return;
  const member = state.member;
  const points = member ? Math.floor(total * tier(member.spent).rate) : 0;
  if (member) {
    member.points += points;
    member.spent += total;
  }
  state.cart = {};
  persist();
  updateCartCount();
  showDialog("모의 결제 완료", `<p class="total"><span>모의 결제액</span><span>${money(total)}</span></p>
    <p>${member ? `${points.toLocaleString("ko-KR")} P 적립 · 현재 ${tier(member.spent).name} 등급` : "비회원으로 주문을 완료했어요."}</p>
    <p class="muted">수업 실습용 주문입니다. 결제 정보와 배송 정보는 수집하지 않습니다.</p>
    <button class="btn primary" data-action="close">쇼핑 계속하기</button>`);
}

function handleAction(event) {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const {action, id} = button.dataset;
  switch (action) {
    case "details": showDetails(findProduct(id)); break;
    case "compare": {
      if (state.compare.has(id)) state.compare.delete(id);
      else if (state.compare.size < 3) state.compare.add(id);
      else { announce("비교 목록에 최대 3개까지 담을 수 있어요."); return; }
      renderCatalog();
      $("#products").querySelector(`[data-action="compare"][data-id="${id}"]`).focus({preventScroll:true});
      break;
    }
    case "add": {
      const quantity = state.cart[id] || 0;
      const message = quantity < 99 ? "장바구니에 담았어요." : "상품별 최대 수량은 99개입니다.";
      if (quantity < 99) changeCart(id, quantity + 1);
      const detailStatus = $("#detailStatus");
      if (detailStatus && $("#dialog").open) {
        detailStatus.textContent = message;
        detailStatus.hidden = false;
      } else announce(message);
      break;
    }
    case "less":
    case "more":
    case "remove": {
      const delta = action === "more" ? 1 : -1;
      changeCart(id, action === "remove" ? 0 : (state.cart[id] || 0) + delta);
      showCart();
      const replacement = $("#dialogBody").querySelector(`[data-action="${action}"][data-id="${id}"]:not(:disabled)`);
      (replacement || $("#dialogBody button:not(:disabled)") || $("#closeDialog")).focus();
      break;
    }
    case "clear-compare":
      state.compare.clear();
      renderCatalog();
      $("#dialog").close();
      break;
    case "checkout": checkout(); break;
    case "close": $("#dialog").close(); break;
  }
}

$("#categories").innerHTML = Object.entries(categories).map(([key,label]) =>
  `<button class="tag" data-category="${key}">${label}</button>`).join("");
const categoryArt = {keyboard:"g515", mouse:"superlight", headset:"hs80", earbuds:"buds"};
$("#departments").innerHTML = Object.entries(categoryArt).map(([category,id]) => {
  const total = products.filter(product => product.category === category).length;
  return `<button type="button" class="department" data-category="${category}">
    <span>${categories[category]}</span><span class="department-count">상품 ${total}개</span>
    <img src="${photo(findProduct(id))}" alt="">
  </button>`;
}).join("");
$("#departments").addEventListener("click", event => {
  const button = event.target.closest("[data-category]");
  if (!button) return;
  state.category = button.dataset.category;
  $("#search").value = "";
  $("#brandFilter").value = "";
  renderCatalog();
  $("#catalog").scrollIntoView({block:"start"});
});
$("#categories").addEventListener("click", event => {
  const button = event.target.closest("[data-category]");
  if (!button) return;
  state.category = button.dataset.category;
  renderCatalog();
});
document.querySelector(".header-row nav").addEventListener("click", event => {
  const link = event.target.closest("a");
  if (!link) return;
  state.category = link.dataset.jump || "all";
  $("#search").value = "";
  $("#brandFilter").value = "";
  renderCatalog();
});
$("#search").addEventListener("input", renderCatalog);
$("#brandFilter").addEventListener("change", renderCatalog);
$("#sort").addEventListener("change", renderCatalog);
$("#products").addEventListener("click", handleAction);
$("#dialogBody").addEventListener("click", handleAction);
$("#dialogBody").addEventListener("submit", event => {
  if (event.target.id !== "memberForm") return;
  event.preventDefault();
  const nickname = new FormData(event.target).get("nickname").trim();
  if (!nickname) return;
  state.member = {nickname, points:0, spent:0};
  persist();
  showMember();
  $("#closeDialog").focus();
});
$("#closeDialog").addEventListener("click", () => $("#dialog").close());
$("#compareButton").addEventListener("click", showComparison);
$("#memberButton").addEventListener("click", showMember);
$("#cartButton").addEventListener("click", showCart);

$("#dots").innerHTML = slides.map((slide, index) =>
  `<button class="hero-dot" aria-label="${findProduct(slide.id).name} 슬라이드" data-slide="${index}"></button>`).join("");
$("#dots").addEventListener("click", event => {
  const button = event.target.closest("[data-slide]");
  if (button) goToSlide(Number(button.dataset.slide));
});
$("#previous").addEventListener("click", () => goToSlide(slideIndex - 1));
$("#next").addEventListener("click", () => goToSlide(slideIndex + 1));
$("#pause").addEventListener("click", () => {
  playing = !playing;
  renderPause();
  resetTimer();
});
$("#heroDetail").addEventListener("click", () => showDetails(findProduct(slides[slideIndex].id)));

renderSlide();
renderPause();
resetTimer();
renderCatalog();
updateCartCount();
</script>
</body>
</html>
